name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: composer lint

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      # Wayfinder writes resources/js/{routes,actions}, which are gitignored, so
      # tsc cannot resolve "@/routes" until they are generated. Mirrors the
      # defensive setup the Dockerfile uses: an empty sqlite file and a file cache
      # keep artisan from needing a real database while booting.
      - name: Generate Wayfinder routes
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i '/^CACHE_STORE=/d' .env && echo 'CACHE_STORE=file' >> .env
          php artisan key:generate
          php artisan wayfinder:generate

      # Catches what ESLint and the Vite build do not: a handler wired with the
      # wrong signature, a null flowing into a non-nullable prop, etc.
      - name: Type Check Frontend
        run: npm run types

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
